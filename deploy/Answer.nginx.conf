# This file is included inside nginx.conf's http block on Ubuntu.
map $http_upgrade $answer_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 16001;
    listen [::]:16001;
    server_name _;

    client_max_body_size 5m;
    access_log /var/log/nginx/Answer.access.log;
    error_log /var/log/nginx/Answer.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $answer_connection_upgrade;
        proxy_read_timeout 60s;
    }
}
